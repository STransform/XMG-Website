{% load i18n %}
{% load static %}

<!-- Modern 2026 Hero: Glassmorphism + Animated Gradient Glow -->
{% block css %}
<style>
  :root {
    --hero-bg-start: #0b0f1a;
    --hero-bg-end: #1e293b;
    --accent: #6366f1;
    /* Indigo – futuristic tech vibe; swap to your brand color */
    --accent-glow: rgba(99, 102, 241, 0.35);
    --glass-bg: rgba(30, 41, 59, 0.45);
    --glass-border: rgba(99, 102, 241, 0.18);
    --text-primary: #f1f5f9;
    --text-secondary: #cbd5e1;
  }

  .hero-section {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--hero-bg-start) 0%, var(--hero-bg-end) 100%);
    position: relative;
    display: flex;
    align-items: center;
    color: var(--text-primary);
    overflow: hidden;
  }

  .hero-section::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.18) 0%, transparent 60%);
    animation: pulse 12s infinite ease-in-out;
    pointer-events: none;
  }

  @keyframes pulse {

    0%,
    100% {
      opacity: 0.6;
      transform: scale(1);
    }

    50% {
      opacity: 0.9;
      transform: scale(1.15);
    }
  }

  .hero-section::after {
    content: "";
    position: absolute;
    inset: 0;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><circle cx="400" cy="400" r="320" fill="none" stroke="%236366f1" stroke-width="1" opacity="0.08"/></svg>') center/cover;
    opacity: 0.12;
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem;
    text-align: center;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    box-shadow: 0 20px 60px var(--accent-glow);
    transition: transform 0.5s ease;
  }

  .hero-content:hover {
    transform: translateY(-8px);
  }

  .hero-title {
    font-size: clamp(3rem, 8vw, 5.5rem);
    font-weight: 900;
    line-height: 1.05;
    margin-bottom: 1.2rem;
    background: linear-gradient(90deg, #f1f5f9, var(--accent), #c7d2fe, #f1f5f9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% auto;
    animation: gradientFlow 6s linear infinite;
  }

  @keyframes gradientFlow {
    0% {
      background-position: 0% center;
    }

    100% {
      background-position: 200% center;
    }
  }

  .hero-subtitle {
    font-size: clamp(1.25rem, 3vw, 1.6rem);
    font-weight: 400;
    color: var(--text-secondary);
    margin-bottom: 3rem;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.5;
  }

  .hero-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.5rem;
  }

  .btn-hero {
    padding: 1rem 2.5rem;
    font-size: 1.2rem;
    font-weight: 600;
    border-radius: 50px;
    text-decoration: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
    border: none;
    box-shadow: 0 10px 30px var(--accent-glow);
  }

  .btn-primary:hover {
    transform: translateY(-5px) scale(1.06);
    box-shadow: 0 20px 50px var(--accent-glow);
  }

  .btn-primary::after {
    content: "";
    position: absolute;
    inset: -100%;
    background: linear-gradient(transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: all 0.6s;
  }

  .btn-primary:hover::after {
    inset: -20%;
  }

  .btn-outline {
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.4);
    color: white;
  }

  .btn-outline:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-5px);
  }

  @media (max-width: 768px) {
    .hero-content {
      padding: 2rem 1.5rem;
      margin: 0 1rem;
    }

    .hero-buttons {
      flex-direction: column;
      gap: 1.2rem;
    }

    .btn-hero {
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
    }
  }
</style>
{% endblock %}

<section class="hero-section">
  <div class="container">
    <div class="hero-content">
      <h1 class="hero-title">{% trans "Innovating the Future" %}</h1>
      <p class="hero-subtitle">{% trans "Empowering industries with cutting-edge engineering solutions." %}</p>
      <div class="hero-buttons">
        <a href="{% url 'services' %}" class="btn-hero btn-primary">{% trans "Explore Services" %}</a>
        <a href="{% url 'about' %}" class="btn-hero btn-outline">{% trans "Learn More" %}</a>
      </div>
    </div>
  </div>
</section>
