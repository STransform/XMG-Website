{% load i18n %} {% load static %}

<!-- Redesigned Statistics Section -->
{% block css %}
<style>
  .stats-section {
    background: linear-gradient(135deg, #f9f9f9, #eaeaea);
    padding: 100px 0;
    text-align: center;
  }

  .stats-section .stat-item {
    padding: 20px;
    transition: transform 0.3s ease;
  }

  .stats-section .stat-item:hover {
    transform: translateY(-10px);
  }

  .stats-section .stat-number {
    font-family: "Poppins", sans-serif;
    font-size: 4rem;
    font-weight: 700;
    color: #ff4c60;
    margin-bottom: 10px;
  }

  .stats-section .stat-label {
    font-size: 1.2rem;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
  }

  @media (max-width: 768px) {
    .stats-section .stat-number {
      font-size: 3rem;
    }

    .stats-section .stat-label {
      font-size: 1rem;
    }
  }
</style>
{% endblock %}

<section class="stats-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-3 col-md-6 mb-4">
        <div class="stat-item">
          <span class="stat-number" data-target="8" data-suffix="+">0+</span>
          <span class="stat-label">{% trans "Projects Completed" %}</span>
        </div>
      </div>
      <div class="col-lg-3 col-md-6 mb-4">
        <div class="stat-item">
          <span class="stat-number" data-target="10" data-suffix="+">0+</span>
          <span class="stat-label">{% trans "Happy Clients" %}</span>
        </div>
      </div>
      <div class="col-lg-3 col-md-6 mb-4">
        <div class="stat-item">
          <span class="stat-number" data-target="2" data-suffix="+">0+</span>
          <span class="stat-label">{% trans "Years Experience" %}</span>
        </div>
      </div>
      <div class="col-lg-3 col-md-6">
        <div class="stat-item">
          <span class="stat-number" data-target="24" data-suffix="/7">0/7</span>
          <span class="stat-label">{% trans "Support Available" %}</span>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const statNumbers = document.querySelectorAll('.stat-number');

    function animateCounter(element) {
      const target = parseInt(element.getAttribute('data-target'));
      const suffix = element.getAttribute('data-suffix') || '';
      const duration = 2000; // 2 seconds
      const increment = target / (duration / 16); // 60fps
      let current = 0;

      const timer = setInterval(() => {
        current += increment;
        if (current >= target) {
          current = target;
          clearInterval(timer);
        }
        element.textContent = Math.floor(current) + suffix;
      }, 16);
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const statNumbers = entry.target.querySelectorAll('.stat-number');
          statNumbers.forEach(stat => {
            if (!stat.classList.contains('animated')) {
              stat.classList.add('animated');
              animateCounter(stat);
            }
          });
        }
      });
    }, {
      threshold: 0.5
    });

    const statsSection = document.querySelector('.stats-section');
    if (statsSection) {
      observer.observe(statsSection);
    }
  });
</script>
