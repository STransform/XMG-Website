{% load i18n %} {% load static %}

{% block css %}
<style>
  .team-section {
    background: #ffffff;
    padding: 110px 0;
  }

  .team-title {
    font-size: 2.8rem;
    font-weight: 700;
    color: #1e2937;
    text-align: center;
    margin-bottom: 4rem;
  }

  .team-card {
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    transition: all 0.4s ease;
  }

  .team-card:hover {
    transform: translateY(-15px);
    box-shadow: 0 30px 70px rgba(79, 70, 229, 0.2);
  }

  .team-card-image {
    height: 320px;
    position: relative;
    overflow: hidden;
  }

  .team-card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease;
  }

  .team-card:hover .team-card-image img {
    transform: scale(1.12);
  }

  .team-card-content {
    padding: 1.8rem 1.5rem;
    text-align: center;
    background: #ffffff;
  }

  .team-member-name {
    font-size: 1.4rem;
    font-weight: 700;
    color: #1e2937;
    margin-bottom: 0.3rem;
  }

  .team-member-role {
    color: #4f46e5;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
</style>
{% endblock %}

<section class="team-section">
  <div class="container">
    <h2 class="team-title">{% trans "Our Teams" %}</h2>

    <div class="row g-4 justify-content-center">
      {% for member in team_members %}
      <div class="col-lg-3 col-md-6 col-sm-6">
        <div class="team-card">
          <div class="team-card-image">
            <img src="{{ member.image.url }}" alt="{{ member.name }}">
          </div>
          <div class="team-card-content">
            <h4 class="team-member-name">{{ member.name }}</h4>
            <p class="team-member-role">{{ member.role }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
