{% load i18n %} {% load static %}

{% block css %}
<style>
  .hero-about-section {
    min-height: 65vh;
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .hero-about-section::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 80% 20%, rgba(79, 70, 229, 0.08) 0%, transparent 50%);
  }

  .about-title {
    font-size: clamp(3rem, 7vw, 4.8rem);
    font-weight: 800;
    color: #1e2937;
    text-align: center;
    line-height: 1.05;
    margin: 0;
    position: relative;
  }

  .about-title::after {
    content: "";
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 4px;
    background: linear-gradient(to right, #800000, #800000);
    border-radius: 4px;
  }
</style>
{% endblock %}

<section class="hero-about-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 text-center">
        <h1 class="about-title">{% trans "About Us" %}</h1>
      </div>
    </div>
  </div>
</section>
