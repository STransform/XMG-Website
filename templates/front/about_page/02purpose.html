{% load i18n %} {% load static %}

{% block css %}
<style>
  .about-content {
    padding: 100px 0;
    background: #ffffff;
  }

  .about-text-highlight {
    font-size: 1.75rem;
    font-weight: 700;
    color: #1e2937;
    line-height: 1.3;
    margin-bottom: 1.8rem;
  }

  .about-text p {
    font-size: 1.15rem;
    line-height: 1.8;
    color: #475569;
  }

  .image-gallery-container {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15);
  }

  .gallery-image-1 {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .image-gallery-container:hover .gallery-image-1 {
    transform: scale(1.08);
  }
</style>
{% endblock %}

<section class="about-content">
  <div class="container">
    <div class="row align-items-center g-5">
      <div class="col-lg-6">
        <div class="about-text">
          <h2 class="about-text-highlight">{{ about_data.title }}</h2>
          <p class="otech-font">{{ about_data.content }}</p>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="image-gallery-container">
          {% if about_data.image_one %}
          <img src="{{ about_data.image_one.url }}" class="gallery-image-1" alt="About OTECH" />
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</section>
