{% load i18n %} {% load static %}

{% block css %}
<style>
  .mvv-section {
    background: #f8fafc;
    padding: 110px 0;
  }

  .mvv-title {
    font-size: 2.8rem;
    font-weight: 700;
    color: #1e2937;
    text-align: center;
    margin-bottom: 4rem;
  }

  .mvv-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 2.5rem;
    height: 100%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    transition: all 0.4s ease;
    border: 1px solid transparent;
  }

  .mvv-card:hover {
    transform: translateY(-12px);
    box-shadow: 0 20px 50px rgba(79, 70, 229, 0.15);
    border-color: #4f46e5;
  }

  .card-icon {
    width: 75px;
    height: 75px;
    background: #4f46e5;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.8rem;
    font-size: 2rem;
    transition: transform 0.4s;
  }

  .mvv-card:hover .card-icon {
    transform: scale(1.15);
  }

  .card-title {
    font-size: 1.55rem;
    font-weight: 700;
    color: #1e2937;
    text-align: center;
    margin-bottom: 1rem;
  }

  .card-text {
    font-size: 1.05rem;
    line-height: 1.75;
    color: #475569;
    text-align: center;
  }
</style>
{% endblock %}

<section class="mvv-section">
  <div class="container">
    <h2 class="mvv-title">Mission <span style="color:#4f46e5">/</span> Vision <span style="color:#4f46e5">/</span>
      Values</h2>

    <div class="row g-4">
      <div class="col-lg-4 col-md-6">
        <div class="mvv-card text-center">
          <div class="card-icon"><i class="bi bi-bullseye"></i></div>
          <h4 class="card-title">{% trans "Mission" %}</h4>
          <p class="card-text">{{ about_data.mission }}</p>
        </div>
      </div>
      <div class="col-lg-4 col-md-6">
        <div class="mvv-card text-center">
          <div class="card-icon"><i class="bi bi-eye"></i></div>
          <h4 class="card-title">{% trans "Vision" %}</h4>
          <p class="card-text">{{ about_data.vision }}</p>
        </div>
      </div>
      <div class="col-lg-4 col-md-6">
        <div class="mvv-card text-center">
          <div class="card-icon"><i class="bi bi-gem"></i></div>
          <h4 class="card-title">{% trans "Values" %}</h4>
          <p class="card-text">{{ about_data.values }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
